                                            className={`w-full text-left p-4 rounded-xl border transition-all duration-200 flex items-center gap-3 group ${answers[qIndex] === opt ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500 shadow-sm' : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50'}`}>
                                            <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border ${answers[qIndex] === opt ? 'bg-blue-500 text-white border-blue-500' : 'bg-white text-gray-500 border-gray-300 group-hover:border-blue-400'}`}>
                                                {String.fromCharCode(65 + i)}
                                            </span>
                                            <span className="text-sm md:text-base text-gray-700">{opt}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-4 border-t flex justify-between items-center z-10">
                            <button disabled={qIndex===0} onClick={()=>setQIndex(qIndex-1)} className="px-6 py-2 rounded-lg font-bold text-gray-600 hover:bg-gray-100 disabled:opacity-30 transition">Previous</button>
                            <button onClick={()=>setAnswers({...answers, [qIndex]: null})} className="text-xs text-red-500 font-bold hover:underline">Clear Selection</button>
                            {qIndex < questions.length - 1 ? ( 
                                <button onClick={()=>setQIndex(qIndex+1)} className="px-8 py-2 bg-gray-800 text-white rounded-lg font-bold hover:bg-gray-700 transition shadow-lg">Next</button> 
                            ) : ( 
                                <button onClick={handleSubmit} className="px-8 py-2 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 transition shadow-lg">Submit Exam</button> 
                            )}
                        </div>
                    </div>

                    <div className="hidden md:flex flex-col w-72 bg-white border-l z-20 shadow-xl">
                        <div className="p-4 border-b bg-gray-50">
                            <h3 className="font-bold text-gray-700 flex items-center gap-2"><Icons.Grid className="w-4 h-4"/> Question Palette</h3>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 custom-scroll">
                            <div className="grid grid-cols-5 gap-2">
                                {questions.map((_, idx) => (
                                    <button key={idx} onClick={() => setQIndex(idx)} 
                                        className={`h-10 w-full rounded-lg text-xs font-bold border transition ${getPaletteColor(idx)}`}>
                                        {idx + 1}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="p-4 border-t bg-gray-50 text-[10px] space-y-2 text-gray-500 font-medium">
                            <div className="flex items-center gap-2"><div className="w-3 h-3 bg-green-500 rounded"></div> Answered</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 bg-purple-500 rounded"></div> Marked for Review</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 bg-gray-100 border border-gray-300 rounded"></div> Not Visited</div>
                        </div>
                    </div>
                    
                    <div className="md:hidden bg-white border-t p-2 flex gap-2 overflow-x-auto">
                         {questions.map((_, idx) => (
                            <button key={idx} onClick={() => setQIndex(idx)} 
                                className={`flex-shrink-0 w-8 h-8 rounded text-xs font-bold border ${getPaletteColor(idx)}`}>
                                {idx + 1}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        if (view === 'results') {
            let myCorrect = 0;
            questions.forEach((q, i) => { 
                const u = String(answers[i] || "").trim().toLowerCase();
                const c = String(q.correct || "").trim().toLowerCase();
                let match = false;
                if(u && c) {
                     if (u === c) match = true;
                     else if (c.includes(u) || u.includes(c)) match = true;
                }
                if (match) myCorrect++;
            });
            const attempted = Object.keys(answers).length;
            const wrong = attempted - myCorrect;
            const myScore = (myCorrect - (wrong * gameNeg)).toFixed(2);
            
            const accuracy = attempted > 0 ? Math.round((myCorrect / attempted) * 100) : 0;
            const maxScore = scores.length > 0 ? parseFloat(scores[0].score) : myScore;
            const avgScore = scores.length > 0 ? (scores.reduce((a,b)=>a+parseFloat(b.score),0) / scores.length).toFixed(1) : myScore;
            
            const pCorrect = Math.round((myCorrect / questions.length) * 100);
            const pWrong = Math.round((wrong / questions.length) * 100);
            const pSkip = 100 - pCorrect - pWrong;
            
            return (
             <div className="min-h-screen p-4 flex justify-center bg-gray-50 custom-scroll overflow-y-auto">
                    <div className="glass-card w-full max-w-4xl p-6 h-fit mb-8 animate-fade-in">
                        <div className="text-center mb-8 border-b pb-6">
                            <Icons.Trophy className="w-16 h-16 text-yellow-400 mx-auto mb-2 drop-shadow-lg"/>
                            <h2 className="text-3xl font-bold text-gray-800">Result Analytics</h2>
                            <div className="text-sm text-gray-500 font-bold mt-1 uppercase tracking-widest">{gameSubject}</div>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div className="bg-white p-6 rounded-xl border shadow-sm flex flex-col items-center justify-center">
                                <h3 className="font-bold text-gray-600 mb-4 text-sm uppercase">Accuracy Distribution</h3>
                                <div className="relative w-40 h-40 rounded-full flex items-center justify-center shadow-inner"
                                     style={{background: `conic-gradient(#22c55e 0% ${pCorrect}%, #ef4444 ${pCorrect}% ${pCorrect+pWrong}%, #f3f4f6 ${pCorrect+pWrong}% 100%)`}}>
                                     <div className="w-28 h-28 bg-white rounded-full flex flex-col items-center justify-center shadow-sm z-10">
                                         <span className="text-3xl font-bold text-gray-800">{accuracy}%</span>
                                         <span className="text-[10px] font-bold text-gray-400 uppercase">Accuracy</span>
                                     </div>
                                </div>
                                <div className="flex gap-4 mt-4 text-xs font-bold">
                                    <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-green-500"></div> Correct</div>
                                    <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-red-500"></div> Wrong</div>
                                    <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-gray-200"></div> Skipped</div>
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-xl border shadow-sm flex flex-col">
                                <h3 className="font-bold text-gray-600 mb-6 text-sm uppercase">Competitive Analysis</h3>
                                <div className="flex-1 flex items-end justify-around gap-4 h-40 pb-2 border-b">
                                    <div className="flex flex-col items-center gap-2 w-16">
                                        <div className="text-xs font-bold text-blue-600">{myScore}</div>
                                        <div style={{height: `${Math.max(10, (myScore/Math.max(1, maxScore))*100)}%`}} className="w-full bg-blue-500 rounded-t-lg shadow-lg animate-bar transition-all"></div>
                                        <div className="text-[10px] font-bold text-gray-500 uppercase">You</div>
                                    </div>
                                    <div className="flex flex-col items-center gap-2 w-16">
                                        <div className="text-xs font-bold text-purple-600">{avgScore}</div>
                                        <div style={{height: `${Math.max(10, (avgScore/Math.max(1, maxScore))*100)}%`}} className="w-full bg-purple-400 rounded-t-lg opacity-80 animate-bar transition-all"></div>
                                        <div className="text-[10px] font-bold text-gray-500 uppercase">Avg</div>
                                    </div>
                                    <div className="flex flex-col items-center gap-2 w-16">
                                        <div className="text-xs font-bold text-yellow-600">{maxScore}</div>
                                        <div className="w-full h-full bg-yellow-400 rounded-t-lg shadow-lg animate-bar transition-all"></div>
                                        <div className="text-[10px] font-bold text-gray-500 uppercase">Top</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 text-center">
                            <div className="bg-gray-50 p-2 rounded-lg border"><div className="text-xs text-gray-500 font-bold uppercase">Total Qs</div><div className="font-bold text-lg">{questions.length}</div></div>
                            <div className="bg-blue-50 p-2 rounded-lg border border-blue-100"><div className="text-xs text-blue-500 font-bold uppercase">Attempted</div><div className="font-bold text-lg">{attempted}</div></div>
                            <div className="bg-green-50 p-2 rounded-lg border border-green-100"><div className="text-xs text-green-500 font-bold uppercase">Correct</div><div className="font-bold text-lg">{myCorrect}</div></div>
                            <div className="bg-red-50 p-2 rounded-lg border border-red-100"><div className="text-xs text-red-500 font-bold uppercase">Wrong</div><div className="font-bold text-lg">{wrong}</div></div>
                        </div>

                        <div className="bg-gray-800 text-white rounded-xl p-4 mb-6 shadow-lg">
                            <h3 className="font-bold text-center text-sm uppercase tracking-widest mb-4 border-b border-gray-700 pb-2">🏆 Leaderboard</h3>
                            <div className="max-h-40 overflow-y-auto custom-scroll">
                                {scores.map((s,i)=><div key={i} className="flex justify-between p-2 border-b border-gray-700 last:border-0 hover:bg-gray-700 rounded transition"><div className="flex items-center gap-3"><span className="font-bold w-6 text-yellow-400">{i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`}</span><span className="text-sm font-medium">{s.name}</span></div><span className="font-bold text-green-400">{s.score}</span></div>)}
                            </div>
                        </div>
                        
                         <div className="space-y-4">
                            <h3 className="font-bold text-gray-500 text-xs uppercase mb-2">Detailed Review & Mistakes</h3>
                            {questions.map((q, i) => { 
                             const u = answers[i]; 
                             const c = q.correct;
                             let match = false;
                             if(u && c) { if (u.toLowerCase() === String(c).toLowerCase() || (String(c).toLowerCase().includes(u.toLowerCase()))) match = true; }
                             
                             if (match) return null; 
                             return ( 
                                <div key={i} className={`p-4 rounded-lg border text-sm ${u ? 'bg-red-50 border-red-100' : 'bg-gray-50 border-gray-200'}`}>
                                    <div className="font-bold text-gray-800 mb-2 leading-relaxed">
                                        {q.q}
                                    </div>
                                    <div className="flex flex-col md:flex-row gap-2 text-xs">
                                        <div className={`font-bold px-2 py-1 rounded w-fit ${u ? 'text-red-700 bg-red-100' : 'text-gray-500 bg-gray-200'}`}>You: <span className="font-normal">{u||"Skipped"}</span></div>
                                        <div className="text-green-700 bg-green-100 px-2 py-1 rounded font-bold w-fit">Correct: <span className="font-normal">{c}</span></div>
                                    </div>
                                </div> 
                             ); 
                            })}
                        </div>
                        <button onClick={()=>window.location.reload()} className="w-full btn-primary py-4 rounded-xl font-bold mt-8 shadow-lg hover:shadow-xl transition transform hover:-translate-y-1">Return to Home</button>
                    </div>
             </div>
            );
        }
    };

    // --- 4. MAIN APP CONTROLLER ---
    const App = () => {
        const [user, setUser] = useState(null);
        const [screen, setScreen] = useState('landing');
        const [loading, setLoading] = useState(true);
        const [showAbout, setShowAbout] = useState(false);
        const [showContact, setShowContact] = useState(false);
        const [contactLinks, setContactLinks] = useState({});

        useEffect(() => { 
            auth.onAuthStateChanged(u => { 
                if(u) {
                    setUser(u); 
                    setScreen(ADMIN_EMAILS.includes(u.email) ? 'admin' : 'user');
                } else {
                    setUser(null);
                    setScreen('landing');
                } 
                setLoading(false); 
            });
            db.ref('settings/contact').on('value', s => { if(s.val()) setContactLinks(s.val()); });
        }, []);

        if (loading) return <div className="flex h-screen items-center justify-center font-bold text-purple-600 text-xl animate-pulse">Loading Quiz Master...</div>;
        if (screen === 'landing') return <LandingPage setScreen={setScreen} />;
        if (screen === 'login') return <AuthForm type="login" setScreen={setScreen} />;
        if (screen === 'signup') return <AuthForm type="signup" setScreen={setScreen} />;
        if (screen === 'admin') return <AdminDashboard user={user} />;
        if (screen === 'user') return <UserDashboard user={user} />;
        return null;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
